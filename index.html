<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Where is Backyard Builder?</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#f9d002">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
</head>
<body>
    <div class="billy-image-container">
        <img class="main-img" src="assets/billy-asking.png" alt="Backyard Builder">
    </div>
    
    <div class="compass-container arrow-container hidden">
        <img class="arrow arrow-idle" src="assets/arrow0.png" alt="Arrow">
        <img class="arrow arrow-live hidden" src="assets/arrow1.png" alt="Arrow">
    </div>

    <div class="compass-container text-container hidden">
        <div style="text-align: center;">
            <div class="spinner hidden"></div>
            <span id="main-text">Finding location</span><br />
            <span id="sub-text">Please wait....</span>
            <div id="status-text"></div>
        </div>
    </div>

    <div class="compass-container start-button-container">
        <button class="start-button" onclick="startLocalization()">Find Backyard Builder</button>
    </div>


    <div class="buttons-container hidden">
        <button class="nav-button" onclick="changeLocation(-1)" aria-label="Previous location">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 5 8 12 15 19" /></svg>
        </button>
        <button class="nav-button" onclick="changeLocation(1)" aria-label="Next location">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 5 16 12 9 19" /></svg>
        </button>
    </div>
</body>
<script>
    // TODO: Add logic to parse id from url
    let currentLocationIdx = 0;
    const locations = [
        {
            id: "backyard-builder",
            lat: 37.551447,
            lon: 127.047016,
            img: "assets/billy-asking.png",
            bgColor: "#fcc22f"
        },
        {
            id: "avec-bike",
            lat: 37.522894,
            lon: 127.020594,
            img: "assets/bb-asking-avec.png",
            bgColor: "#f0f0f0"
        }
    ];

    // iOS Safari ignores user-scalable=no
    document.addEventListener('gesturestart', e => e.preventDefault());

    // Location related stuff
    let deviceLat = null;
    let deviceLon = null;

    // UI related stuff
    const arrowIdle = document.querySelector('.arrow-idle');
    const arrow = document.querySelector('.arrow-live');
    const text = document.querySelector('#main-text');
    const subText = document.querySelector('#sub-text');
    const statusText = document.querySelector('#status-text');
    const statusMessages = {};

    // Secondary problems (e.g. orientation) go here so they don't overwrite the distance.
    function setStatus(key, message) {
        statusMessages[key] = message;
        statusText.textContent = Object.values(statusMessages).filter(Boolean).join('\n');
    }

    // Before the first fix a location error replaces the distance; afterwards it is only a status.
    function handleLocationError(error) {
        if (deviceLat !== null) {
            setStatus('location', `Location unavailable: ${error.message}`);
            return;
        }
        setLoading(false);
        text.textContent = "Failed to get location";
        subText.textContent = error.message;
    }

    function showArrow() {
        document.querySelector('.arrow-container').classList.remove('hidden');
    }
    function showNavButtons() {
        document.querySelector('.buttons-container').classList.remove('hidden');
    }
    function showText() {
        document.querySelector('.text-container').classList.remove('hidden');
    }
    function hideButton() {
        document.querySelector('.start-button-container').classList.add('hidden');
    }
    function setLoading(loading) {
        document.querySelector('.spinner').classList.toggle('hidden', !loading);
    }

    function setImageAndBackground() {
        const mainImg = document.querySelector('.main-img');
        mainImg.src = locations[currentLocationIdx].img;
        document.body.style.backgroundColor = locations[currentLocationIdx].bgColor;
    }

    function changeLocation(step) {
        currentLocationIdx = (currentLocationIdx + step + locations.length) % locations.length;
        setImageAndBackground();
        if (deviceLat !== null) {
            updateLocation(deviceLat, deviceLon);
        }
    }

    function setRotation(angle) {
        if (deviceLat === null || deviceLon === null) {
            return;
        }
        // Step 1: Convert coordinates from degrees to radians for mathematical calculations
        const lat1Rad = deviceLat * Math.PI / 180;
        const lat2Rad = locations[currentLocationIdx].lat * Math.PI / 180;
        const deltaLonRad = (locations[currentLocationIdx].lon - deviceLon) * Math.PI / 180;
        
        // Step 2: Calculate the bearing using the forward azimuth formula
        // This gives us the angle from north to the target point
        const y = Math.sin(deltaLonRad) * Math.cos(lat2Rad);
        const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - 
                Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(deltaLonRad);
        // Step 3: Convert the result to degrees and normalize to 0-360 range
        let bearingFromNorth = Math.atan2(y, x) * 180 / Math.PI;
        bearingFromNorth = (bearingFromNorth + 360) % 360;

        // Step 4: Calculate the relative bearing by subtracting device orientation
        // This tells us which direction to turn from where the device is currently pointing
        let relativeBearing = bearingFromNorth - angle;

        // Step 5: Normalize the relative bearing to -180 to +180 range
        // Positive means turn right, negative means turn left
        if (relativeBearing > 180) relativeBearing -= 360;
        if (relativeBearing < -180) relativeBearing += 360;

        // Step 6: Apply the rotation to the arrow element
        // Swapping img.src doesn't repaint on iOS until a touch, so toggle two preloaded images instead.
        arrowIdle.classList.add('hidden');
        arrow.classList.remove('hidden');
        arrow.style.transform = `rotate(${relativeBearing}deg)`;
        
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // metres
        const phi1 = lat1 * Math.PI/180;
        const phi2 = lat2 * Math.PI/180;
        const deltaPhi = (lat2-lat1) * Math.PI/180;
        const deltaLambda = (lon2-lon1) * Math.PI/180;

        const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                  Math.cos(phi1) * Math.cos(phi2) *
                  Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        return R * c;
    }

    function updateLocation(lat, lon) {
        setLoading(false);
        setStatus('location', null);
        showArrow();
        showNavButtons();
        // Update distance
        const location = locations[currentLocationIdx];
        const distance = calculateDistance(lat, lon, location.lat, location.lon);
        if (distance >= 100000) {
            text.textContent = `${(distance/1000).toFixed(0)}`;
            subText.textContent = "km";
        } else if (distance >= 1000) {
            text.textContent = `${(distance/1000).toFixed(2)}`;
            subText.textContent = "km";
        } else {
            text.textContent = `${distance.toFixed(0)}`;
            subText.textContent = "m";
        }
    }

    function registerGeolocationUpdates() {
        // Watch for changes in the device location (precise updates)
        navigator.geolocation.watchPosition(
            (position) => {
                deviceLat = position.coords.latitude; // Needed for arrow calculation
                deviceLon = position.coords.longitude; // Needed for arrow calculation
                updateLocation(position.coords.latitude, position.coords.longitude);
            },
            (error) => {
                handleLocationError(error);
            },
            { enableHighAccuracy: true }
        );
    }

    function registerOrientationUpdates() {
        
    }

    // Localization initialization
    async function startLocalization() {
        hideButton();
        showText();
        setLoading(true);

        // ============== DEVICE LOCATION =============
        if (!navigator.geolocation) {
            setLoading(false);
            text.textContent = "Geolocation not supported";
            subText.textContent = "Cannot access device location";
            return;
        }

        // First get the approximate location of the device
        // Hopefully this will improve speed on Android
        navigator.geolocation.getCurrentPosition(
            (position) => {
                deviceLat = position.coords.latitude;
                deviceLon = position.coords.longitude;
                updateLocation(position.coords.latitude, position.coords.longitude);
                registerGeolocationUpdates(); // Then start watching for precise location updates
            },
            (error) => {
                // The watch below may already have delivered a position.
                handleLocationError(error);
            },
            { enableHighAccuracy: false, timeout: 30000 }
        );

        // ============== END DEVICE LOCATION =============


        // ============== DEVICE ORIENTATION =============
        // Some devices require explicit permission to access device orientation
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
            const permissionStatus = await DeviceOrientationEvent.requestPermission(); // Note: some devices always return granted
            if (permissionStatus === "granted") {
                window.addEventListener('deviceorientation', orientationEventHandler);
            } else {
                setStatus('orientation', "Orientation permission denied");
            }
            return;
        }
        
        // For devices that do not require explicit permission, directly add the event listener
        window.addEventListener('deviceorientation', orientationEventHandler);
        // ============== END DEVICE ORIENTATION =============
    }

    function orientationEventHandler(event) {
        if (event.webkitCompassHeading !== undefined) {
            setRotation(event.webkitCompassHeading);
            return;
        }
        
        if (!event.absolute) {
            // Fallback for devices that do not provide absolute orientation
            window.removeEventListener('deviceorientation', orientationEventHandler);
            window.addEventListener('deviceorientationabsolute', orientationEventHandler);
            return;
        }

        // Desktops expose the event but report no heading.
        if (event.alpha === null) return;

        setRotation(360 - event.alpha);
    }

    setImageAndBackground();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
    }
</script>
<style>
    html, body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        touch-action: pan-x pan-y;
    }

    .billy-image-container {
        position: absolute;
        top: 0;
        height: 50vh;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        /* height: 100vh; */
        overflow: hidden;
    }

    .compass-container {
        position: absolute;
        bottom: 20vh;
        height: 30vh;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .buttons-container {
        position: absolute;
        bottom: 0vh;
        height: 20vh;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .nav-button {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 48px;
        height: 48px;
        margin: 0 24px;
        padding: 0;
        cursor: pointer;
        background-color: #007BFF;
        color: white;
        border: none;
        border-radius: 50%;
    }

    .nav-button svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .main-img {
        max-width: 80%;
        max-height: 80%;
    }

    .arrow-container {
        z-index: 9;
    }

    .text-container {
        z-index: 10;
    }

    .arrow {
        max-width: 80%;
        max-height: 80%;
        z-index: 9;
    }

    .spinner {
        width: 24px;
        height: 24px;
        margin: 0 auto 10px;
        box-sizing: border-box;
        border: 3px solid rgba(0, 0, 0, 0.2);
        border-top-color: rgba(0, 0, 0, 0.8);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .hidden {
        display: none;
    }

    .start-button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #007BFF;
        color: white;
        border: none;
        border-radius: 5px;
    }

    #main-text {
        font-size: 24px;
        font-weight: bold;
    }

    #sub-text {
        font-size: 18px;
    }

    #status-text {
        margin-top: 8px;
        font-size: 14px;
        white-space: pre-line;
    }
</style>
</html>
